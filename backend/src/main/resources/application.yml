spring:
  application:
    name: finance-ai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/financeai}
    username: ${DATABASE_USERNAME:financeai}
    password: ${DATABASE_PASSWORD:financeai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

finance-ai:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-finance-ai-jwt-secret-key-min-256-bits}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:30000}
  open-finance:
    provider: ${OPEN_FINANCE_PROVIDER:pluggy}
    base-url: ${OPEN_FINANCE_BASE_URL:https://api.pluggy.ai}
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    webhook-url: ${OPEN_FINANCE_WEBHOOK_URL:}
    oauth-redirect-url: ${OPEN_FINANCE_OAUTH_REDIRECT_URL:}
    include-sandbox: ${OPEN_FINANCE_INCLUDE_SANDBOX:false}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-path: ${STORAGE_LOCAL_BASE_PATH:./uploads}
    oci:
      namespace: ${OCI_NAMESPACE:}
      bucket-name: ${OCI_BUCKET_NAME:}
      region: ${OCI_REGION:}
  resend-email:
    api-key: ${RESEND_API_KEY:re_dummy_key}
    from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}

resend-email:
  api-key: ${RESEND_API_KEY:re_dummy_key}
  from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    operationsSorter: method
