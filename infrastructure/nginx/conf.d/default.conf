resolver 127.0.0.11 valid=10s ipv6=off;

upstream financeai_backend {
    zone financeai_backend 64k;
    server backend:8080 resolve;
}

upstream financeai_frontend {
    zone financeai_frontend 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    server_name _;

    # Permite arquivos de ate 5 MiB mais o overhead do multipart.
    # O limite efetivo do arquivo e validado pelo Spring e pela aplicacao.
    client_max_body_size 6m;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API requests go to Spring Boot backend
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://financeai_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Actuator health is exposed for internal monitoring only (not /api/ path)
    location /actuator/health {
        proxy_pass http://financeai_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # Static frontend
    location / {
        proxy_pass http://financeai_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny ai-service direct access from outside
    location /internal/ {
        return 403;
    }
}
