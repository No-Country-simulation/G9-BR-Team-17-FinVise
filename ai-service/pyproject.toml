[project]
name = "finvise-ai-service"
version = "1.0.0"
description = "AI service for FinVise — transaction/profile classification and financial assistant agent."
requires-python = ">=3.11"
authors = [{ name = "FinVise Team" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.9.0",
    "joblib==1.5.1",
    "pyarrow==21.0.0",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.15.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "training*", "evaluation*"]
exclude = ["tests*", "data*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[project.scripts]
prepare-dataset = "training.prepare_dataset:main"
train-transaction = "training.train_transaction_classifier:main"
train-profile = "training.train_profile_classifier:main"
evaluate-models = "training.evaluate_models:main"
provision-models = "training.provision_models:main"
evaluate-rag = "evaluation.evaluate_rag:main"
