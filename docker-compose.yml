services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finvise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finvise}
      POSTGRES_USER: ${POSTGRES_USER:-finvise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finvise_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finvise} -d ${POSTGRES_DB:-finvise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports: []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finvise-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/finvise}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-finvise}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      HIBERNATE_JDBC_BATCH_SIZE: ${HIBERNATE_JDBC_BATCH_SIZE:-100}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must have at least 32 characters}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://163.176.174.219:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required and must have at least 32 characters}
      AI_SERVICE_CONNECT_TIMEOUT_MS: ${AI_SERVICE_CONNECT_TIMEOUT_MS:-5000}
      AI_SERVICE_READ_TIMEOUT_MS: ${AI_SERVICE_READ_TIMEOUT_MS:-30000}
      SSE_TIMEOUT_MS: ${SSE_TIMEOUT_MS:-120000}
      AGENT_HISTORY_MAX_MESSAGES: ${AGENT_HISTORY_MAX_MESSAGES:-16}
      AGENT_INPUT_TOKEN_BUDGET: ${AGENT_INPUT_TOKEN_BUDGET:-8000}
      AGENT_SUMMARY_MAX_CHARS: ${AGENT_SUMMARY_MAX_CHARS:-4000}
      AGENT_SUMMARY_BATCH_SIZE: ${AGENT_SUMMARY_BATCH_SIZE:-100}
      AGENT_RECENT_TRANSACTIONS: ${AGENT_RECENT_TRANSACTIONS:-20}
      AGENT_RECURRING_EXPENSES: ${AGENT_RECURRING_EXPENSES:-20}
      AGENT_ANALYTICAL_MAX_MONTHS: ${AGENT_ANALYTICAL_MAX_MONTHS:-60}
      AGENT_CONVERSATION_LOCK_TIMEOUT_MS: ${AGENT_CONVERSATION_LOCK_TIMEOUT_MS:-120000}
      RAG_INDEX_QUEUE_ENABLED: ${RAG_INDEX_QUEUE_ENABLED:-true}
      RAG_INDEX_QUEUE_POLL_DELAY_MS: ${RAG_INDEX_QUEUE_POLL_DELAY_MS:-1000}
      RAG_INDEX_QUEUE_LOCK_TIMEOUT_MS: ${RAG_INDEX_QUEUE_LOCK_TIMEOUT_MS:-120000}
      RAG_INDEX_QUEUE_HEARTBEAT_INTERVAL_MS: ${RAG_INDEX_QUEUE_HEARTBEAT_INTERVAL_MS:-30000}
      RAG_INDEX_QUEUE_MAX_BATCHES_PER_DRAIN: ${RAG_INDEX_QUEUE_MAX_BATCHES_PER_DRAIN:-100}
      RAG_INDEX_QUEUE_MAX_ATTEMPTS: ${RAG_INDEX_QUEUE_MAX_ATTEMPTS:-5}
      RAG_INDEX_QUEUE_RETRY_BASE_DELAY_MS: ${RAG_INDEX_QUEUE_RETRY_BASE_DELAY_MS:-2000}
      RAG_INDEX_QUEUE_RETRY_MAX_DELAY_MS: ${RAG_INDEX_QUEUE_RETRY_MAX_DELAY_MS:-60000}
      OPEN_FINANCE_PROVIDER: ${OPEN_FINANCE_PROVIDER:-pluggy}
      OPEN_FINANCE_BASE_URL: ${OPEN_FINANCE_BASE_URL:-https://api.pluggy.ai}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      OPEN_FINANCE_WEBHOOK_URL: ${OPEN_FINANCE_WEBHOOK_URL:-}
      OPEN_FINANCE_OAUTH_REDIRECT_URL: ${OPEN_FINANCE_OAUTH_REDIRECT_URL:-}
      OPEN_FINANCE_INCLUDE_SANDBOX: ${OPEN_FINANCE_INCLUDE_SANDBOX:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_BASE_PATH: ${STORAGE_LOCAL_BASE_PATH:-/app/uploads}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-}
      OCI_REGION: ${OCI_REGION:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-onboarding@resend.dev}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - finvise_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: finvise-ai-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/finvise}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER:-finvise}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-finvise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-finvise}
      MODELS_DIR: ${MODELS_DIR:-/app/models}
      TRANSACTION_MODEL_PATH: ${TRANSACTION_MODEL_PATH:-/app/models/transaction-classifier}
      PROFILE_MODEL_PATH: ${PROFILE_MODEL_PATH:-/app/models/profile-classifier}
      ENVIRONMENT: ${AI_SERVICE_ENVIRONMENT:-development}
      REQUIRE_ACTIVE_MODELS: ${REQUIRE_ACTIVE_MODELS:-true}
      TRANSACTION_MODEL_VERSION: ${TRANSACTION_MODEL_VERSION:-1.1.0-bootstrap.1}
      PROFILE_MODEL_VERSION: ${PROFILE_MODEL_VERSION:-1.0.0-bootstrap.1}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required and must have at least 32 characters}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_LLM: ${ENABLE_LLM:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT:-30}
      AGENT_INPUT_TOKEN_BUDGET: ${AGENT_INPUT_TOKEN_BUDGET:-8000}
      RAG_ENABLE_REMOTE_EMBEDDINGS: ${RAG_ENABLE_REMOTE_EMBEDDINGS:-true}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-200}
      RAG_INDEX_MAX_BATCHES: ${RAG_INDEX_MAX_BATCHES:-100}
      RAG_MIN_RELEVANCE: ${RAG_MIN_RELEVANCE:-0.18}
      RAG_HYBRID_RRF_K: ${RAG_HYBRID_RRF_K:-60}
      RAG_VECTOR_WEIGHT: ${RAG_VECTOR_WEIGHT:-1.0}
      RAG_TEXT_WEIGHT: ${RAG_TEXT_WEIGHT:-1.0}
      RAG_CANDIDATE_MULTIPLIER: ${RAG_CANDIDATE_MULTIPLIER:-4}
      RAG_RETRIEVAL_METRICS_WINDOW: ${RAG_RETRIEVAL_METRICS_WINDOW:-1000}
      RAG_DB_POOL_MIN_SIZE: ${RAG_DB_POOL_MIN_SIZE:-0}
      RAG_DB_POOL_MAX_SIZE: ${RAG_DB_POOL_MAX_SIZE:-10}
      RAG_DB_POOL_TIMEOUT_SECONDS: ${RAG_DB_POOL_TIMEOUT_SECONDS:-10}
    networks:
      - finvise_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: finvise-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finvise_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: finvise-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - finvise_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://nginx/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  finvise_internal:
    driver: bridge
    internal: false
