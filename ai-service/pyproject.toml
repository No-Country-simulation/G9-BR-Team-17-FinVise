[project]
name = "finvise-ai-service"
version = "1.0.0"
description = "AI service for FinVise — transaction/profile classification and financial assistant agent."
requires-python = ">=3.11"
authors = [{ name = "FinVise Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn==1.9.0",
    "joblib>=1.4.0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "training*"]
exclude = ["tests*", "data*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[project.scripts]
prepare-dataset = "training.prepare_dataset:main"
train-transaction = "training.train_transaction_classifier:main"
train-profile = "training.train_profile_classifier:main"
evaluate-models = "training.evaluate_models:main"
