spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/financeai}
    username: ${TEST_DATABASE_USERNAME:financeai}
    password: ${TEST_DATABASE_PASSWORD:financeai}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    root: WARN
    com.financeai.backend: INFO

finance-ai:
  security:
    jwt:
      secret: test-secret-key-min-256-bits-for-jwt-signing-only

resend-email:
  api-key: ${RESEND_API_KEY:re_dummy_test_key}
  from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
